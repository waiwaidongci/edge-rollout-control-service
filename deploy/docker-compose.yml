services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: edge_rollout
      POSTGRES_USER: edge_rollout
      POSTGRES_PASSWORD: edge_rollout
    ports:
      - "5432:5432"
    volumes:
      - edge_rollout_postgres:/var/lib/postgresql/data
      - ../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_rollout -d edge_rollout"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  edge_rollout_postgres:
